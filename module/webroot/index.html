<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TB378FC 手柄震动修复</title>
<style>
:root{
  --bg:#f6f4f9; --surface:#fff; --surface2:#efecf4; --on-surface:#1c1b1f;
  --on-surface-variant:#49454e; --outline:#cac4d0; --outline-variant:#e7e0ec;
  --primary:#6750a4; --on-primary:#fff; --primary-container:#e9ddff; --on-primary-container:#22005d;
  --error:#b3261e; --error-container:#f9dedc; --on-error-container:#410e0b;
  --tertiary-container:#ffd8e4; --on-tertiary-container:#31111d;
  --secondary-container:#e8def8; --on-secondary-container:#1d192b;
}
@media (prefers-color-scheme: dark){
:root{
  --bg:#141218; --surface:#1d1b20; --surface2:#2b2930; --on-surface:#e6e0e9;
  --on-surface-variant:#cac4d0; --outline:#938f99; --outline-variant:#49454e;
  --primary:#d0bcff; --on-primary:#381e72; --primary-container:#4f378b; --on-primary-container:#eaddff;
  --error:#f2b8b5; --error-container:#8c1d18; --on-error-container:#f9dedc;
  --tertiary-container:#633b48; --on-tertiary-container:#ffd8e4;
  --secondary-container:#4a4458; --on-secondary-container:#e8def8;
}}
*{box-sizing:border-box}
body{margin:0;padding:16px 14px 40px;background:var(--bg);color:var(--on-surface);
  font:15px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%}
h1{font-size:20px;font-weight:600;margin:4px 0 2px}
.sub{color:var(--on-surface-variant);font-size:13px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;
  padding:14px;margin-bottom:12px}
.row{display:flex;align-items:flex-start;gap:12px}
.grow{flex:1;min-width:0}
.title{font-weight:600;font-size:15px}
.desc{color:var(--on-surface-variant);font-size:13px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;
  margin-top:9px;border:1px solid transparent;max-width:100%}
.st .dot{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.st.ok{background:var(--primary-container);color:var(--on-primary-container)}
.st.bad{background:var(--error-container);color:var(--on-error-container)}
.st.mid{background:transparent;color:var(--on-surface-variant);border-color:var(--outline-variant)}
.sw{position:relative;flex:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);
  background:var(--surface2);cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;
  background:var(--outline);transform:translateY(-50%);transition:left .15s,width .15s,height .15s,background .15s}
.sw[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"]::after{left:26px;width:20px;height:20px;background:var(--on-primary)}
.kv{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--on-surface-variant);
  background:var(--surface2);border-radius:10px;padding:10px;margin-top:10px;white-space:pre-wrap;word-break:break-all}
.btn{border:1px solid var(--outline);background:var(--surface);color:var(--on-surface);border-radius:999px;
  padding:9px 16px;font-size:14px;font-family:inherit;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.log{margin-top:12px;background:var(--surface2);border-radius:10px;padding:10px;max-height:220px;overflow:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all}
.log .bad{color:var(--error)} .log .ok{color:var(--primary)} .log .warn{color:var(--on-surface-variant)}
</style>
</head>
<body>
<h1>TB378FC 手柄震动修复</h1>
<div class="sub" id="ver">读取中…</div>
<div id="cards"></div>
<div class="card">
  <div class="title">手柄与链路</div>
  <div class="desc" id="padinfo">读取中…</div>
  <div class="btns">
    <button class="btn primary" id="test">测试震动（1 秒满幅）</button>
    <button class="btn" id="refresh">刷新状态</button>
    <button class="btn" id="status">看详细状态</button>
  </div>
</div>
<div class="log" id="log">就绪。</div>

<script>
"use strict";
const M = "/data/adb/modules/tb378fc_gamepad_rumble";
const $ = s => document.querySelector(s);
let CFG = {}, busy = false;

function logLine(msg, kind){
  const d = new Date(), p2 = n => String(n).padStart(2,"0");
  const ts = p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds());
  const s = document.createElement("span");
  s.className = kind || "";
  s.textContent = ts + "  " + msg + "\n";
  const box = $("#log"); box.appendChild(s); box.scrollTop = box.scrollHeight;
}
const q = v => "'" + String(v).replace(/'/g, "'\\''") + "'";

async function run(cmd){
  if (!window.ksu || !ksu.exec) throw new Error("KernelSU WebUI API 不可用（请用 KernelSU 管理器打开本页）");
  const r = await ksu.exec(cmd);
  const out = (typeof r === "string") ? r : ((r && (r.stdout || r.result)) || "");
  const err = (r && r.stderr) || "";
  if (err) logLine("stderr: " + err, "warn");
  return out || "";
}

async function readCfg(){
  const out = await run("sh " + q(M + "/bridge.sh") + " --json");
  const m = /\{[\s\S]*\}/.exec(out);
  if (!m) throw new Error("读不到状态（--json 没有输出）");
  return JSON.parse(m[0]);
}

const ITEMS = [
  {
    key: "FIX_GAMEPAD_RUMBLE",
    title: "让框架把手柄震动下发下来",
    desc: "移植包把 Settings.System.vibrate_input_devices 留成了未设置（=0）。AOSP 的 " +
          "VibratorManagerService 里 InputDeviceDelegate 就是靠这个开关决定要不要把「输入设备" +
          "（手柄）的振动器」注册进来；关着时手柄震动会被静默丢弃 —— 连输入法 / SystemUI 的 " +
          "触感也一起死（它们的震动走同一条被丢弃的路径）。\n" +
          "打开后 dumpsys vibrator_manager 里的状态会从 IGNORED_UNSUPPORTED 变成 " +
          "FORWARDED_TO_INPUT_DEVICES。",
    st: s => String(s.RUMBLE_SETTING) === "1"
      ? { k:"ok",  t:"已打开（vibrate_input_devices=1）" }
      : { k:"bad", t:"未打开（vibrate_input_devices=" + (s.RUMBLE_SETTING || "空") + "）—— 手柄震动会被丢弃" }
  },
  {
    key: null,
    title: "bridge 守护进程",
    desc: "跟着内核 InputReader 的震动日志走（本机编译时开了 DEBUG_VIBRATOR），把框架的震动意图" +
          "按**正确格式**重发到手柄的 hidraw 节点。\n" +
          "为什么需要它：本机内核 hid-microsoft 驱动给 Xbox Series（045e:0b13）构造的 FF 输出报告" +
          "字段顺序与手柄 HID 描述符声明相反（[duration][start_delay][loop_count] vs " +
          "[duration][loop_count][start_delay]），控制器把报告读成「延迟 2.55 秒、循环 0 次」，" +
          "所以永远震不起来。驱动是内建的、框架侧 EventHub 是 native，两边都改不了 —— 只能自己补发一份。",
    st: s => s.BRIDGE_RUNNING === 1
      ? { k:"ok",  t:"运行中" }
      : { k:"bad", t:"未运行（看下面日志；重启设备或检查 disable 标记）" }
  }
];

function el(tag, cls, txt){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined && txt !== null) n.textContent = txt;
  return n;
}
function pill(st){
  const p = el("span", "st " + (st.k === "ok" ? "ok" : (st.k === "bad" ? "bad" : "mid")));
  p.appendChild(el("span", "dot"));
  p.appendChild(el("span", null, st.t));
  return p;
}
function buildItem(it){
  const card = el("div", "card");
  const row = el("div", "row");
  const g = el("div", "grow");
  g.appendChild(el("div", "title", it.title));
  g.appendChild(el("div", "desc", it.desc));
  g.appendChild(pill(it.st(CFG)));
  row.appendChild(g);
  if (it.key){
    const sw = el("button", "sw");
    sw.type = "button";
    sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", CFG[it.key] === 1 ? "true" : "false");
    sw.setAttribute("aria-label", it.title);
    sw.addEventListener("click", async () => {
      if (busy) return;
      busy = true; sw.disabled = true;
      const want = CFG[it.key] === 1 ? 0 : 1;
      try {
        logLine("写入 " + it.key + "=" + want + " …");
        await run("sh " + q(M + "/bridge.sh") + " --set " + it.key + " " + want);
        await refresh(true);
        logLine("已写入（重启设备后由 service.sh 生效）", "ok");
      } catch(e){ logLine("失败: " + e.message, "bad"); }
      finally { busy = false; sw.disabled = false; }
    });
    row.appendChild(sw);
  }
  card.appendChild(row);
  return card;
}
function render(){
  const box = $("#cards");
  box.textContent = "";
  for (const it of ITEMS) box.appendChild(buildItem(it));
  $("#padinfo").textContent =
    "识别到的手柄：" + (CFG.PAD_COUNT || 0) + " 个\n" +
    (CFG.PAD_MAP ? CFG.PAD_MAP : "（没有找到带 FF 且有 hidraw 的设备 —— 手柄没连，或没连上蓝牙）") + "\n" +
    "映射来自 dumpsys input 的 Input Reader 段：deviceId → SysfsRootPath/hidraw/*";
  $("#ver").textContent = "版本 " + (CFG.VERSION || "?") + " · " + M;
}

async function refresh(quiet){
  if (busy) return;
  busy = true;
  try {
    CFG = await readCfg();
    render();
    if (!quiet) logLine("状态已刷新", "ok");
  } catch(e){
    logLine("读取失败: " + e.message, "bad");
    $("#ver").textContent = "读取失败：" + e.message;
  } finally { busy = false; }
}

$("#refresh").addEventListener("click", () => refresh(false));
$("#test").addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  try {
    logLine("发送 1 秒满幅测试震动…");
    const out = await run("sh " + q(M + "/bridge.sh") + " --once 255 255 1000");
    logLine(String(out).trim(), "ok");
  } catch(e){ logLine("失败: " + e.message, "bad"); }
  finally { busy = false; }
});
$("#status").addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  try {
    const out = await run("sh " + q(M + "/bridge.sh") + " --status");
    for (const line of String(out).split("\n")) if (line.trim()) logLine(line);
  } catch(e){ logLine("失败: " + e.message, "bad"); }
  finally { busy = false; }
});
refresh(true);
</script>
</body>
</html>
